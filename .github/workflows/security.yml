name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit (high & critical)
        run: bun audit --audit-level=high

  secret-scan:
    name: Secret leak scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  supabase-rls-check:
    name: Supabase migration RLS sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any new public CREATE TABLE lacks RLS enable
        run: |
          set -e
          missing=0
          for f in $(git diff --name-only --diff-filter=A origin/main...HEAD -- 'supabase/migrations/*.sql' 2>/dev/null || ls supabase/migrations/*.sql 2>/dev/null); do
            [ -f "$f" ] || continue
            if grep -Eiq 'create\s+table\s+public\.' "$f"; then
              if ! grep -Eiq 'enable\s+row\s+level\s+security' "$f"; then
                echo "::error file=$f::Migration creates a public table but does not ENABLE ROW LEVEL SECURITY"
                missing=1
              fi
              if ! grep -Eiq 'grant\s+' "$f"; then
                echo "::error file=$f::Migration creates a public table but is missing GRANT statements"
                missing=1
              fi
            fi
          done
          exit $missing